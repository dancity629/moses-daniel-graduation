name: Connect graduation site to Supabase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        env:
          SUPABASE_URL: https://kgrtwskdxrpamvrvskfg.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtncnR3c2tkeHJwYW12cnZza2ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTg5NTIsImV4cCI6MjEwMjAzNDk1Mn0.J5zkKyWSiuuR0IEqBpNB6sxRoK6tl3wCX30Ab1v7c2M
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Load Supabase client before the site's main script.
          cdn = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if cdn not in text:
              text = text.replace('</head>', cdn + '\n</head>', 1)

          # Create the browser client inside the existing main script.
          config = '''const SUPABASE_URL = %r;
          const SUPABASE_ANON_KEY = %r;
          const { createClient } = window.supabase;
          const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          ''' % (os.environ['SUPABASE_URL'], os.environ['SUPABASE_ANON_KEY'])

          marker = "<script>\ndocument.write('<style>'"
          if 'const SUPABASE_URL =' not in text:
              if marker not in text:
                  raise SystemExit('Could not find main script marker')
              text = text.replace(marker, '<script>\n' + config + "document.write('<style>'", 1)

          guestbook_start = text.find('/* =========================================================================\n   GUESTBOOK — persisted with window.storage')
          stats_start = text.find('/* =========================================================================\n   VISITOR STATS', guestbook_start)
          if guestbook_start == -1 or stats_start == -1:
              raise SystemExit('Could not find guestbook section')

          guestbook = r'''/* =========================================================================
   GUESTBOOK — SUPABASE
   ========================================================================= */
let gbEntries = [];
let gbVisibleCount = 6;
let visitorId = null;
let likedIds = [];

async function initVisitorIdentity(){
  let vid = await storeGet('visitor:id', false);
  if(!vid){ vid = uid(); await storeSet('visitor:id', vid, false); }
  visitorId = vid;
  const likes = await storeGet('visitor:likes', false);
  likedIds = likes ? JSON.parse(likes) : [];
}

async function loadGuestbook(){
  try {
    const { data, error } = await db
      .from('guestbook')
      .select('*')
      .order('created_at', { ascending:false });
    if(error) throw error;
    gbEntries = (data || []).map(e => ({
      id:e.id,
      name:e.name,
      relationship:e.relationship,
      message:e.message,
      likes:e.likes || 0,
      ts:new Date(e.created_at).getTime()
    }));
    renderGuestbook();
    updateStats();
  } catch(error) {
    console.error('Supabase guestbook error:', error);
    $('#gbMsgs').innerHTML = '<div class="gb-empty">Unable to load messages right now. Please refresh.</div>';
  }
}

function renderGuestbook(){
  const q = ($('#gbSearch').value||'').toLowerCase().trim();
  const rel = $('#gbFilter').value;
  const filtered = gbEntries.filter(e => {
    const matchQ = !q || e.name.toLowerCase().includes(q);
    const matchRel = !rel || e.relationship === rel;
    return matchQ && matchRel;
  });
  const shown = filtered.slice(0, gbVisibleCount);
  $('#gbMore').style.display = filtered.length > gbVisibleCount ? 'inline-flex' : 'none';

  if(shown.length===0){
    $('#gbMsgs').innerHTML = '<div class="gb-empty">No messages yet — be the first to celebrate! 🎓</div>';
    return;
  }

  $('#gbMsgs').innerHTML = shown.map(e=>{
    const liked = likedIds.includes(e.id);
    return `
    <div class="gb-card reveal show" data-id="${e.id}">
      <div class="gb-head">
        <div class="gb-avatar">${esc(e.name.slice(0,1).toUpperCase())}</div>
        <div>
          <div class="gb-name">${esc(e.name)}</div>
          <div class="gb-rel">${esc(e.relationship)}</div>
        </div>
        <div class="gb-time">${timeAgo(e.ts)}</div>
      </div>
      <div class="gb-msg-text">${esc(e.message)}</div>
      <button class="gb-like ${liked?'liked':''}" data-id="${e.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-heart"/></svg>
        <span>${e.likes||0}</span>
      </button>
    </div>`;
  }).join('');

  $$('.gb-like').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const entry = gbEntries.find(e=>e.id===id);
      if(!entry) return;
      const already = likedIds.includes(id);
      const oldLikes = entry.likes || 0;
      if(already){
        entry.likes = Math.max(0, oldLikes-1);
        likedIds = likedIds.filter(x=>x!==id);
      } else {
        entry.likes = oldLikes+1;
        likedIds.push(id);
      }

      const { error } = await db
        .from('guestbook')
        .update({ likes:entry.likes })
        .eq('id', id);

      if(error){
        entry.likes = oldLikes;
        likedIds = likedIds.filter(x=>x!==id);
        console.error('Like update failed. A guestbook UPDATE policy is required for likes:', error);
        alert('Likes are temporarily unavailable.');
        renderGuestbook();
        return;
      }

      await storeSet('visitor:likes', JSON.stringify(likedIds), false);
      renderGuestbook();
    });
  });
}

$('#gbSearch').addEventListener('input', ()=>{ gbVisibleCount=6; renderGuestbook(); });
$('#gbFilter').addEventListener('change', ()=>{ gbVisibleCount=6; renderGuestbook(); });
$('#gbMore').addEventListener('click', ()=>{ gbVisibleCount += 6; renderGuestbook(); });

function validateGbField(id, ok){
  $(id).classList.toggle('invalid', !ok);
  return ok;
}

$('#gbSubmit').addEventListener('click', async ()=>{
  const name = $('#in-name').value.trim();
  const rel = $('#in-rel').value;
  const msg = $('#in-msg').value.trim();
  const okName = validateGbField('#f-name', name.length>=2);
  const okRel = validateGbField('#f-rel', !!rel);
  const okMsg = validateGbField('#f-msg', msg.length>=3);
  if(!(okName && okRel && okMsg)) return;

  try {
    const { data, error } = await db
      .from('guestbook')
      .insert({ name, relationship:rel, message:msg })
      .select()
      .single();
    if(error) throw error;

    gbEntries.unshift({
      id:data.id,
      name:data.name,
      relationship:data.relationship,
      message:data.message,
      likes:data.likes || 0,
      ts:new Date(data.created_at).getTime()
    });

    $('#in-name').value='';
    $('#in-rel').value='';
    $('#in-msg').value='';
    $('#gbSuccess').classList.add('show');
    setTimeout(()=> $('#gbSuccess').classList.remove('show'), 3200);
    burstConfetti(60);
    gbVisibleCount = Math.max(gbVisibleCount, 6);
    renderGuestbook();
    updateStats();
  } catch(error) {
    console.error('Failed to submit guestbook:', error);
    alert('Sorry, your message could not be posted. Please try again.');
  }
});

'''

          text = text[:guestbook_start] + guestbook + text[stats_start:]

          stats_start = text.find('/* =========================================================================\n   VISITOR STATS')
          confetti_start = text.find('/* =========================================================================\n   CONFETTI', stats_start)
          if stats_start == -1 or confetti_start == -1:
              raise SystemExit('Could not find visitor stats section')

          stats = r'''/* =========================================================================
   VISITOR STATS — SUPABASE
   ========================================================================= */
async function updateStats(){
  $('#statMessages').textContent = gbEntries.length;
  try {
    const { data, error } = await db
      .from('visitor_stats')
      .select('total_visitors')
      .eq('id',1)
      .single();
    if(error) throw error;
    $('#statVisitors').textContent = data?.total_visitors ?? 0;
  } catch(error) {
    console.error('Failed to load visitor stats:', error);
    $('#statVisitors').textContent = '0';
  }
  const days = Math.max(0, Math.floor((Date.now()-gradDate)/86400000));
  $('#statDays').textContent = Date.now() >= gradDate ? days : '—';
}

async function registerVisitorOnce(){
  const seen = await storeGet('visitor:seen', false);
  if(seen) return;
  await storeSet('visitor:seen', 'true', false);
  try {
    const { data, error } = await db.rpc('increment_visitor_count');
    if(error) throw error;
    $('#statVisitors').textContent = data;
    setTimeout(()=> burstConfetti(90), 900);
  } catch(error) {
    console.error('Visitor counter error:', error);
  }
}

'''
          text = text[:stats_start] + stats + text[confetti_start:]

          # The old admin delete path depended on the removed shared-storage save function.
          # Disable only the destructive button for now; Supabase Auth can be added later.
          old = '''    btn.addEventListener('click', async ()=>{\n      gbEntries = gbEntries.filter(e=>e.id!==btn.dataset.del);\n      await saveGuestbook();\n      renderAdminList(); renderGuestbook(); updateStats();\n    });'''
          new = '''    btn.addEventListener('click', ()=>{\n      alert('Admin deletion is disabled until Supabase Auth is enabled for secure moderation.');\n    });'''
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          test -s index.html
          grep -q "kgrtwskdxrpamvrvskfg.supabase.co" index.html
          grep -q "from('guestbook')" index.html
          grep -q "increment_visitor_count" index.html

      - name: Commit patched index and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/connect-supabase.yml
          git add index.html .github/workflows/connect-supabase.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: connect guestbook and visitor stats to Supabase"
          git push